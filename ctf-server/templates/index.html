<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTF de Criptografia · WorkInTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root { --bg:#0E1621; --card:#16222F; --line:#26364A; --text:#E8EDF2; --muted:#9FB0C0; --amber:#F2B84B; --teal:#4CC9BE; --bad:#FF8A7A; --mono:'JetBrains Mono','Courier New',monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',Arial,sans-serif; line-height:1.5; }
  .wrap { max-width:1120px; margin:0 auto; padding:32px 20px 64px; }
  .eyebrow { font-family:var(--mono); font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--amber); margin:0 0 8px; }
  h1 { font-size:clamp(30px,5vw,48px); line-height:1.1; margin:0 0 12px; }
  h2 { font-size:22px; margin:0 0 8px; }
  p { margin:0 0 12px; }
  .muted { color:var(--muted); }
  header { display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-end; margin-bottom:32px; }
  .player-chip { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 8px 8px 18px; font-family:var(--mono); font-size:14px; }
  .player-chip b { color:var(--teal); }
  .layout { display:grid; gap:24px; grid-template-columns:1fr; }
  @media (min-width:920px) { .layout { grid-template-columns:1fr 340px; align-items:start; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  .stack { display:flex; flex-direction:column; gap:24px; }
  .level-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .tag { font-family:var(--mono); font-size:13px; letter-spacing:1px; border:1px solid var(--line); border-radius:999px; padding:2px 12px; color:var(--muted); }
  .tag.done { color:#0E1621; background:var(--teal); border-color:var(--teal); font-weight:600; }
  pre.puzzle { font-family:var(--mono); font-size:15px; line-height:1.6; background:#0B121B; border:1px solid var(--line); border-radius:10px; padding:16px; margin:12px 0; white-space:pre-wrap; word-break:break-word; color:var(--teal); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 220px; min-width:0; background:#0B121B; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:var(--mono); font-size:15px; }
  input[type=text]:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  button { font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; border-radius:10px; border:1px solid transparent; padding:12px 18px; background:var(--amber); color:#0E1621; }
  button.ghost { background:transparent; color:var(--text); border-color:var(--line); padding:8px 14px; font-weight:400; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .feedback { min-height:24px; margin:10px 0 0; font-size:15px; }
  .feedback.ok { color:var(--teal); } .feedback.bad { color:var(--bad); }
  details { margin-top:12px; color:var(--muted); } summary { cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:400; font-family:var(--mono); font-size:13px; text-transform:uppercase; letter-spacing:1px; }
  td.num { text-align:right; font-family:var(--mono); }
  tr.me td { color:var(--teal); font-weight:600; }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">WorkInTech · Axion</p>
      <h1>CTF de Criptografia</h1>
      <p class="muted">Cada participante recebe puzzles próprios. Escreva o seu código, descubra a flag e envie no formato <span style="font-family:var(--mono);color:var(--text)">FLAG{...}</span>.</p>
    </div>
    <div class="player-chip" id="chip" hidden>
      <span>jogador: <b id="chip-name"></b></span>
      <span id="chip-points"></span>
      <button class="ghost" id="logout" type="button">Sair</button>
    </div>
  </header>

  <section class="card" id="login" style="max-width:520px" hidden>
    <h2>Entrar</h2>
    <p class="muted">Escolha um apelido. Não use dados pessoais reais. Seus puzzles são gerados a partir dele.</p>
    <form id="login-form" autocomplete="off">
      <label for="nick">Apelido</label>
      <div class="row">
        <input type="text" id="nick" maxlength="24" placeholder="ex.: ada_lovelace" required>
        <button type="submit">Começar</button>
      </div>
      <p class="feedback bad" id="login-error" role="alert"></p>
    </form>
  </section>

  <div class="layout" id="game" hidden>
    <div class="stack" id="levels"></div>
    <aside class="card">
      <h2>Placar</h2>
      <table>
        <thead><tr><th>#</th><th>Jogador</th><th style="text-align:right">Pts</th></tr></thead>
        <tbody id="board"></tbody>
      </table>
    </aside>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let me = null;

async function api(path, body) {
  const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) { /* resposta vazia */ }
  return { status: res.status, data };
}

function show() {
  const logged = !!(me && me.logged_in);
  $('#login').hidden = logged;
  $('#game').hidden = !logged;
  $('#chip').hidden = !logged;
  if (logged) {
    $('#chip-name').textContent = me.nick;
    $('#chip-points').textContent = me.points + ' pts';
    renderLevels();
    refreshBoard();
  }
}

function renderLevels() {
  const wrap = $('#levels');
  wrap.textContent = '';
  me.levels.forEach(l => {
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML =
      '<div class="level-head"><h2></h2><span class="tag"></span></div>' +
      '<p class="muted desc"></p><pre class="puzzle"></pre>' +
      '<button class="ghost copy" type="button">Copiar dados</button>' +
      '<form class="submit" autocomplete="off" style="margin-top:16px"><label>Sua flag</label>' +
      '<div class="row"><input type="text" placeholder="FLAG{...}" required><button type="submit">Enviar flag</button></div>' +
      '<p class="feedback" role="status" aria-live="polite"></p></form>' +
      '<details><summary>Dica</summary><p class="hint" style="margin-top:8px"></p></details>';
    card.querySelector('h2').textContent = l.title;
    card.querySelector('.desc').textContent = l.desc;
    card.querySelector('.hint').textContent = l.hint;
    const pre = card.querySelector('pre');
    // Um valor por linha, sem rótulo no texto copiado: facilita colar direto no Python.
    pre.textContent = l.lines.map(x => x.label + ': ' + x.value).join('\n');
    const tag = card.querySelector('.tag');
    const fb = card.querySelector('.feedback');
    const input = card.querySelector('input');
    const submit = card.querySelector('form button');
    function paintTag() {
      if (l.solved) { tag.textContent = 'resolvido · +' + l.points; tag.className = 'tag done'; }
      else { tag.textContent = l.points + ' pts'; tag.className = 'tag'; }
    }
    paintTag();
    card.querySelector('.copy').addEventListener('click', async () => {
      const first = l.lines[0].value;
      try { await navigator.clipboard.writeText(l.lines.filter(x => x.label !== 'Dica').map(x => x.value).join('\n')); fb.textContent = 'Dados copiados.'; fb.className = 'feedback ok'; }
      catch (e) { fb.textContent = 'Não foi possível copiar. Selecione o texto manualmente.'; fb.className = 'feedback bad'; }
    });
    card.querySelector('form').addEventListener('submit', async ev => {
      ev.preventDefault();
      if (l.solved) { fb.textContent = 'Você já resolveu este nível.'; fb.className = 'feedback ok'; return; }
      submit.disabled = true;
      const { data } = await api('/api/submit', { level: l.id, flag: input.value });
      fb.textContent = data.message || data.error || 'Erro inesperado.';
      fb.className = 'feedback ' + (data.ok ? 'ok' : 'bad');
      if (data.ok) { l.solved = true; me.points += data.points; paintTag(); $('#chip-points').textContent = me.points + ' pts'; refreshBoard(); }
      setTimeout(() => { submit.disabled = false; }, data.ok ? 0 : 3000);
    });
    wrap.append(card);
  });
}

async function refreshBoard() {
  const { data } = await api('/api/board');
  const body = $('#board');
  body.textContent = '';
  (data || []).forEach((r, i) => {
    const tr = document.createElement('tr');
    if (me && r.nick === me.nick) tr.className = 'me';
    const a = document.createElement('td'); a.textContent = String(i + 1);
    const b = document.createElement('td'); b.textContent = r.nick;
    const c = document.createElement('td'); c.className = 'num'; c.textContent = String(r.points);
    tr.append(a, b, c); body.append(tr);
  });
}

$('#login-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const { status, data } = await api('/api/login', { nick: $('#nick').value });
  if (status !== 200) { $('#login-error').textContent = data.error || 'Erro ao entrar.'; return; }
  $('#login-error').textContent = '';
  me = data; show();
});
$('#logout').addEventListener('click', async () => { await api('/api/logout', {}); me = null; $('#nick').value = ''; show(); });

(async () => { const { data } = await api('/api/me'); me = data; show(); })();
setInterval(() => { if (me && me.logged_in) refreshBoard(); }, 5000);
</script>
</body>
</html>
